<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo circular claro: garantiza contraste tanto sobre el overlay oscuro del hero
       como sobre la navbar blanca al hacer scroll, sin necesitar dos versiones distintas -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF" stroke="#4FA8DE" stroke-width="2"/>

  <!-- Monograma "CF" -->
  <path d="M25.5 22.5c-5.2 0-9.2 4.2-9.2 9.5s4 9.5 9.2 9.5c2.8 0 5.1-1.1 6.8-3" stroke="#1B3A57" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M39 22.8h9.2M39 22.8v18.4M39 32h7.6" stroke="#1B3A57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pequeño acento cálido: una hoja/corazón que evoca cuidado y bienestar -->
  <path d="M32 12.5c1.6 1.5 2.5 3 2.5 4.4 0 1.5-1.1 2.6-2.5 2.6s-2.5-1.1-2.5-2.6c0-1.4.9-2.9 2.5-4.4Z" fill="#F5B942"/>
</svg>
